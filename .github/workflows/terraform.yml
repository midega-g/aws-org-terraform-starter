name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    # No paths filter on PRs: the security stage must run on every PR.

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Security stage: no cloud credentials needed. Gates everything below.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: 'Security: gitleaks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so every commit in the PR is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: 'Security: checkov'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet checkov==3.2.256
      # Same invocation as the pre-commit hook. Calling checkov without
      # --config-file silently ignores the skip-check list.
      - run: checkov --config-file .checkov.yaml

  # ---------------------------------------------------------------------------
  # Static checks: fmt + validate for every workspace, no AWS access needed.
  # ---------------------------------------------------------------------------
  validate:
    name: 'Validate: ${{ matrix.workspace }}'
    runs-on: ubuntu-latest
    needs: [gitleaks, checkov]
    strategy:
      matrix:
        workspace: [00_bootstrap, 01_org, 02_scps, 03_iam, 04_github_oidc]
    defaults:
      run:
        working-directory: terraform/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ---------------------------------------------------------------------------
  # Plan (PRs and main) and apply (main only). These need AWS, so they only
  # run once you set the repository VARIABLE  ENABLE_AWS=true  and the secrets
  # AWS_ROLE_ARN, TF_STATE_BUCKET (see docs/RUNBOOK.md -> CI setup).
  #
  # 00_bootstrap is excluded on purpose: it uses local state and is applied by
  # hand once.
  #
  # max-parallel: 1 runs the matrix in listed order (dependency order). A failed
  # plan stops the matrix, so the matching apply is skipped; apply never runs
  # on a pull request because of the `if:` condition.
  # ---------------------------------------------------------------------------
  plan:
    name: 'Plan: ${{ matrix.workspace }}'
    if: vars.ENABLE_AWS == 'true'
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        workspace: [01_org, 02_scps, 03_iam, 04_github_oidc]
    defaults:
      run:
        working-directory: terraform/${{ matrix.workspace }}
    env:
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: |
          printf 'bucket = "%s"\nregion = "us-east-1"\n' "$TF_STATE_BUCKET" > ../backend.hcl
          terraform init -input=false -backend-config=../backend.hcl
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      # -input=false: with no TTY a missing variable would otherwise hang the job.
      - run: terraform plan -input=false -no-color

  apply:
    name: 'Apply: ${{ matrix.workspace }}'
    if: vars.ENABLE_AWS == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        workspace: [01_org, 02_scps, 03_iam, 04_github_oidc]
    defaults:
      run:
        working-directory: terraform/${{ matrix.workspace }}
    env:
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: |
          printf 'bucket = "%s"\nregion = "us-east-1"\n' "$TF_STATE_BUCKET" > ../backend.hcl
          terraform init -input=false -backend-config=../backend.hcl
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      - run: terraform apply -auto-approve -input=false -no-color

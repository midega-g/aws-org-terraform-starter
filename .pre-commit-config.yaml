# Install both commit and push hooks:  pre-commit install --install-hooks
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.256
    hooks:
      - id: checkov
        args: ["--config-file", ".checkov.yaml"]

  - repo: local
    hooks:
      - id: no-push-to-main
        name: Block direct push to main
        entry: scripts/no-push-to-main.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: denylist-staged
        name: Block names from local .denylist
        entry: scripts/check-denylist.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: denylist-message
        name: Block names in commit message
        entry: scripts/check-denylist.sh
        language: script
        stages: [commit-msg]
        always_run: true
